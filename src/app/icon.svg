<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="蟹足腫研究資料收集平台">
  <!--
    分頁圖示：綠色 OK 繃。
    斜放 45° 是 OK 繃最好認的姿態，16px 下只剩剪影也還讀得出來。

    用深綠圓角方形打底、繃帶用淺綠：分頁列在淺色與深色主題下底色差很多，
    有了底磚才能保證兩種情況都看得見；圓角方形也比同尺寸的圓形更填滿圖示格。
    繃帶的長寬比是挑過的——再粗一點就會讀成膠囊，再細一點在 16px 下會糊成一條線。
    配色取自專案設計系統：brand-700 底、brand-200 繃帶、紙白吸墊。
  -->
  <rect width="32" height="32" rx="7.5" fill="#325823"/>

  <g transform="rotate(-45 16 16)">
    <!-- 繃帶本體 -->
    <rect x="4.4" y="11.7" width="23.2" height="8.6" rx="4.3" fill="#c0dba8"/>
    <!-- 中央吸墊 -->
    <rect x="11.4" y="11.7" width="9.2" height="8.6" fill="#fbfaf5"/>
    <!-- 兩翼的透氣孔：16px 下會糊掉，但放大時是 OK 繃的關鍵細節 -->
    <g fill="#325823" opacity=".5">
      <circle cx="7.4" cy="14.37" r=".9"/><circle cx="9.9" cy="14.37" r=".9"/>
      <circle cx="7.4" cy="17.63" r=".9"/><circle cx="9.9" cy="17.63" r=".9"/>
      <circle cx="22.1" cy="14.37" r=".9"/><circle cx="24.6" cy="14.37" r=".9"/>
      <circle cx="22.1" cy="17.63" r=".9"/><circle cx="24.6" cy="17.63" r=".9"/>
    </g>
  </g>
</svg>
